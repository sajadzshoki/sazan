services:
  app:
    image: node:22
    container_name: sazan-app
    working_dir: /app
    command: sh -c "npm ci --include=dev && npm run build && node .output/server/index.mjs"
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - main
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: sazan-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - default
    restart: unless-stopped

volumes:
  mongo-data:
    name: sazan_mongo-data
  uploads:
    name: sazan_uploads
  node_modules:
    name: sazan_node_modules

networks:
  main:
    external: true
    name: main
